<!DOCTYPE html>
<html lang="mn">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Family-Tree</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>

    <body>
        <header class="main-header">
            <nav class="main-menu">
                <a class="site-name" href="#home">Family-Tree</a>
                <button class="menu-button" type="button">☰</button>
                
                <div class="menu-links">
                    <a href="#home">Нүүр</a>
                    <a href="#family-tree">Удмын мод</a>
                </div>
            </nav>
        </header>

        <main>
            <section id="home" class="home-section">
                <div class="home-content">
                    <h1>Бидний<br>түүх</h1>
                    <a class="view-tree-button" href="#family-tree">Удмын мод үзэх ↓</a>
                </div>

                <div class="home-photos">
                    <img class="photo one" src="images/family1.jpg" alt="Гэр бүлийн зураг 1">
                    <img class="photo two" src="images/family2.jpg" alt="Гэр бүлийн зураг 2">
                    <img class="photo three" src="images/family3.jpg" alt="Гэр бүлийн зураг 3">
                    <img class="photo four" src="images/family4.jpg" alt="Гэр бүлийн зураг 4">
                </div>
            </section>

            <section id="family-tree" class="tree-section">
                <h2>Манай гэр бүлийн мод</h2>
                
                <div class="tree-content">
                    <img class="tree-background" src="images/tree.png" alt="Удмын мод">
                    
                    <button class="member paternal-grandpa" data-person="paternalGrandfather">
                        <img src="images/paternal-grandpa.jpg" alt="Аавын аав">
                        <span>Аавын аав</span>
                    </button>

                    <button class="member paternal-grandma" data-person="paternalGrandmother">
                        <img src="images/paternal-grandma.jpg" alt="Аавын ээж">
                        <span>Аавын ээж</span>
                    </button>

                    <button class="member maternal-grandpa" data-person="maternalGrandfather">
                        <img src="images/maternal-grandpa.jpg" alt="Ээжийн аав">
                        <span>Ээжийн аав</span>
                    </button>

                    <button class="member maternal-grandma" data-person="maternalGrandmother">
                        <img src="images/maternal-grandma.jpg" alt="Ээжийн ээж">
                        <span>Ээжийн ээж</span>
                    </button>

                    <button class="member father" data-person="father">
                        <img src="images/father.jpg" alt="Аав">
                        <span>Аав</span>
                    </button>

                    <button class="member mother" data-person="mother">
                        <img src="images/mother.jpg" alt="Ээж">
                        <span>Ээж</span>
                    </button>

                    <button class="member older-sister" data-person="olderSister">
                        <img src="images/older-sistrer.jpg" alt="Том эгч">
                        <span>Том эгч</span>
                    </button>

                    <button class="member nephew" data-person="olderSistersSon">
                        <img src="images/older-sisters-son.jpg" alt="Том эгчийн хүү">
                        <span>Том эгчийн хүү</span>
                    </button>

                    <button class="member younger-sister" data-person="youngerSister">
                        <img src="images/younger-sistrer.jpg" alt="Дараагийн эгч">
                        <span>Дараагийн эгч</span>
                    </button>

                    <button class="member brother" data-person="brother">
                        <img src="images/brother.jpg" alt="Ах">
                        <span>Ах</span>
                    </button>

                    <button class="member me" data-person="me">
                        <img src="images/me.jpg" alt="Би">
                        <span>Би</span>
                    </button>
                </div>

                <p class="hint">
                    Гэр бүлийн гишүүдийн зураг дээр дарж түүхийг уншина уу.
                </p>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Миний гэр бүлийн 3 үеийн түүх</p>
        </footer>

        <div class="info-window" id="person-info" hidden>
            <div class="info-box">
                <button class="close-info-btn" type="button">x</button>
                <img id="info-photo" src="images/me.jpg" alt="Гэр бүлийн гишүүний зураг">
                <h2 id="info-name"></h2>
                <p id="info-relation"></p>
                <p id="info-biography"></p>
            </div>
        </div>
    </body>
</html>
